# Copy to .github/workflows/pr-gates.yml in a service repo. Rules: docs/gates.md in 2026-spd-shop-harness.
# Bump the tag by PR, like the plugin pin in .claude/settings.json.
name: PR gates
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  trace:
    uses: koldovsky/2026-spd-shop-harness/.github/workflows/trace-gate.yml@v1.6.0
    # with:
    #   key-pattern: 'PRICE-[0-9]+'
  size:
    uses: koldovsky/2026-spd-shop-harness/.github/workflows/diff-size.yml@v1.6.0
    # with:
    #   fail: 400
    #   exclude: 'parity/corpus/**'
