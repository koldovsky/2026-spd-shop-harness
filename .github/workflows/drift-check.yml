# Reusable workflow. In a service repo:
#   jobs:
#     drift:
#       uses: koldovsky/2026-spd-shop-harness/.github/workflows/drift-check.yml@main
name: harness drift check
on:
  workflow_call: {}
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: koldovsky/2026-spd-shop-harness
          path: .shop-harness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .shop-harness/ci/drift-check.mjs --harness .shop-harness
