name: validate harness
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JSON manifests parse and every plugin source exists
        run: |
          node -e '
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
          for (const p of m.plugins) {
            const dir = p.source.replace(/^\.\//, "");
            JSON.parse(fs.readFileSync(dir + "/.claude-plugin/plugin.json", "utf8"));
            console.log("ok", p.name);
          }'
      - name: Every skill has a description and a review-by date
        run: |
          fail=0
          for f in $(find plugins -name SKILL.md); do
            grep -q "^description:" "$f" || { echo "::error file=$f::missing description"; fail=1; }
            grep -q "review-by:" "$f" || { echo "::error file=$f::missing review-by"; fail=1; }
          done
          exit $fail
      - name: Gate scripts pass their unit tests
        run: node --test "ci/*.test.mjs"
