# Reusable trace gate (rules: docs/gates.md). Caller in a service repo: templates/pr-gates.yml.
# harness-ref picks the version of ci/trace-gate.mjs; its default is the tag this file ships in.
name: trace gate
on:
  workflow_call:
    inputs:
      key-pattern:
        description: Regex of a requirement key, e.g. 'PRICE-[0-9]+'
        type: string
        default: '[A-Z][A-Z0-9]+-[0-9]+'
      evidence-dir:
        description: Folder of evidence files; changes there after the verified revision are allowed
        type: string
        default: docs/evidence/
      harness-ref:
        description: Ref of koldovsky/2026-spd-shop-harness to take the script from
        type: string
        default: v1.6.0
permissions:
  contents: read
jobs:
  trace:
    name: trace gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: koldovsky/2026-spd-shop-harness
          ref: ${{ inputs.harness-ref }}
          path: .shop-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Key in the PR title, Refs on every commit, evidence for the head
        env: # PR text goes through env, never into the script source
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KEY_PATTERN: ${{ inputs.key-pattern }}
          EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        run: node .shop-harness/ci/trace-gate.mjs
